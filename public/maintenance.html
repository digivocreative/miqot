<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance - Alhijaz Indowisata</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .highlight {
      color: #38bdf8;
      font-weight: 600;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: #38bdf8;
      margin: 24px auto;
      border-radius: 2px;
    }
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#128736;&#65039;</div>
    <h1>Sedang Maintenance</h1>
    <div class="divider"></div>
    <p>Sistem sedang dalam perbaikan untuk meningkatkan layanan kami.</p>
    <p>Silakan kembali dalam beberapa saat.</p>
    <p class="footer">Alhijaz Indowisata</p>
  </div>
</body>
</html>
