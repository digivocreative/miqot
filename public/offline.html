<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex" />
  <title>Tidak ada koneksi · Alhijaz</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #475569; --line: #e2e8f0; --accent: #059669; --accent-ink: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #020617; --card: #0f172a; --ink: #f1f5f9; --muted: #94a3b8; --line: #1e293b; --accent: #10b981; --accent-ink: #022c22; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; text-align: center; }
    svg { width: 44px; height: 44px; color: var(--muted); }
    h1 { margin: 14px 0 6px; font-size: 19px; line-height: 1.3; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
    .actions { display: grid; gap: 10px; }
    button, a { display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1; text-decoration: none; cursor: pointer; }
    button { border: 0; background: var(--accent); color: var(--accent-ink); }
    a { border: 1px solid var(--line); color: var(--ink); }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 8.8a15 15 0 0 1 20 0" /><path d="M5 12.6a10 10 0 0 1 14 0" /><path d="M8.5 16.3a5 5 0 0 1 7 0" /><path d="M12 20h.01" /><path d="M3 3l18 18" />
    </svg>
    <h1>Tidak ada koneksi internet</h1>
    <p>Halaman ini perlu internet untuk dibuka. Periksa sinyal atau Wi-Fi, lalu coba lagi.</p>
    <div class="actions">
      <button type="button" id="retry">Coba lagi</button>
      <a href="/">Buka jadwal tersimpan</a>
    </div>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
