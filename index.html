<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Cek jadwal dan harga paket Umroh Alhijaz Indowisata" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#001427" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alhijaz" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Dynamic PWA Manifest: overrides start_url to preserve agent slug
      // Only runs when on a slug path (e.g. /bagas, /nikita)
      (function() {
        var path = window.location.pathname;
        if (!path || path === '/') return;
        var origin = window.location.origin;

        fetch('/manifest.webmanifest')
          .then(function(r) { return r.json(); })
          .then(function(manifest) {
            manifest.start_url = origin + path;
            manifest.scope = origin + '/';
            // Convert relative icon src to absolute (blob: URLs can't resolve relative paths)
            if (manifest.icons) {
              manifest.icons = manifest.icons.map(function(icon) {
                if (icon.src && icon.src.startsWith('/')) {
                  icon.src = origin + icon.src;
                }
                return icon;
              });
            }
            var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            // Remove existing static manifest link (injected by VitePWA)
            var existing = document.querySelector('link[rel="manifest"]');
            if (existing) existing.remove();
            // Inject dynamic manifest
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);
          })
          .catch(function() { /* Keep static manifest on error */ });
      })();
    </script>
    
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Jadwal Umroh - Alhijaz Indowisata" />
    <meta property="og:description" content="Cek jadwal dan harga paket Umroh Alhijaz Indowisata" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alhijaz Indowisata" />

    <title>Jadwal Umroh - Alhijaz Indowisata</title>
    <!-- Preload ONLY the Inter weights used above-the-fold in the app UI (Tailwind
         font-sans = Inter: body 400, labels/titles 600, headings 700). The display
         fonts (Bebas/Oswald/Montserrat/Roboto Condensed) and heavy Inter weights are
         brochure/snapdom-only: BrochureSchedulePage loads them on demand via
         document.fonts.load() and awaits document.fonts.ready before capture, so they
         must NOT block (and steal bandwidth on) every page load. They remain available
         through the @font-face rules below (font-display: swap). `crossorigin="anonymous"`
         is required by spec for `as=font` preloads even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" href="/fonts/brochure/Inter-Regular.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" href="/fonts/brochure/Inter-SemiBold.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" href="/fonts/brochure/Inter-Bold.woff2">
    <style>
      @font-face { font-family: 'Bebas Neue'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/brochure/BebasNeue-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/brochure/Inter-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/brochure/Inter-SemiBold.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/brochure/Inter-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 800; font-display: swap; src: url('/fonts/brochure/Inter-ExtraBold.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 900; font-display: swap; src: url('/fonts/brochure/Inter-Black.woff2') format('woff2'); }
      @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/brochure/Oswald-Regular.woff2') format('woff2'); }
      @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/brochure/Oswald-Medium.woff2') format('woff2'); }
      @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/brochure/Oswald-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/brochure/Montserrat-Bold.woff2') format('woff2'); }
      @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 800; font-display: swap; src: url('/fonts/brochure/Montserrat-ExtraBold.woff2') format('woff2'); }
      @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 900; font-display: swap; src: url('/fonts/brochure/Montserrat-Black.woff2') format('woff2'); }
      @font-face { font-family: 'Roboto Condensed'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/brochure/RobotoCondensed-SemiBold.woff2') format('woff2'); }
      @font-face { font-family: 'Roboto Condensed'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/brochure/RobotoCondensed-Bold.woff2') format('woff2'); }
    </style>
  </head>
  <body>
    <script>
      // Bypass service worker for server-rendered pages (Cloudflare Functions).
      // When the old cached SW serves this SPA for routes like /*/umroh,
      // this script detects it and forces a hard reload from the server.
      (function() {
        var p = location.pathname;
        if (/\/[^/]+\/(?:umroh|haji|bio)\/?$/i.test(p) || /^\/bio\/?$/i.test(p) || /\/brosur\//i.test(p) || /\/itinerary\//i.test(p) || /\/[^/]+\/jamaah(\/|$)/i.test(p)) {
          // Mark that we're doing a bypass reload so we don't loop
          var key = '__sw_bypass_' + p;
          try {
            if (sessionStorage.getItem(key)) {
              sessionStorage.removeItem(key);
              return; // Already reloaded once, don't loop
            }
            sessionStorage.setItem(key, '1');
          } catch (e) {
            return; // Storage unavailable; do not risk a reload loop
          }
          // Unregister SW for this scope, then hard reload
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
                location.reload();
              });
            });
          } else {
            location.reload();
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
