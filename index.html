<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Cek jadwal dan harga paket Umroh Alhijaz Indowisata" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#001427" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alhijaz" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Dynamic PWA Manifest: overrides start_url to preserve agent slug
      // Only runs when on a slug path (e.g. /bagas, /nikita)
      (function() {
        var path = window.location.pathname;
        if (!path || path === '/') return;
        var origin = window.location.origin;

        fetch('/manifest.webmanifest')
          .then(function(r) { return r.json(); })
          .then(function(manifest) {
            manifest.start_url = origin + path;
            manifest.scope = origin + '/';
            // Convert relative icon src to absolute (blob: URLs can't resolve relative paths)
            if (manifest.icons) {
              manifest.icons = manifest.icons.map(function(icon) {
                if (icon.src && icon.src.startsWith('/')) {
                  icon.src = origin + icon.src;
                }
                return icon;
              });
            }
            var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            // Remove existing static manifest link (injected by VitePWA)
            var existing = document.querySelector('link[rel="manifest"]');
            if (existing) existing.remove();
            // Inject dynamic manifest
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);
          })
          .catch(function() { /* Keep static manifest on error */ });
      })();
    </script>
    
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Jadwal Umroh - Alhijaz Indowisata" />
    <meta property="og:description" content="Cek jadwal dan harga paket Umroh Alhijaz Indowisata" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alhijaz Indowisata" />

    <title>Jadwal Umroh - Alhijaz Indowisata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Bypass service worker for server-rendered pages (Cloudflare Functions).
      // When the old cached SW serves this SPA for routes like /*/umroh,
      // this script detects it and forces a hard reload from the server.
      (function() {
        var p = location.pathname;
        if (/\/[^/]+\/umroh\/?$/i.test(p) || /\/brosur\//i.test(p) || /\/itinerary\//i.test(p)) {
          // Mark that we're doing a bypass reload so we don't loop
          var key = '__sw_bypass_' + p;
          if (sessionStorage.getItem(key)) {
            sessionStorage.removeItem(key);
            return; // Already reloaded once, don't loop
          }
          sessionStorage.setItem(key, '1');
          // Unregister SW for this scope, then hard reload
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
                location.reload();
              });
            });
          } else {
            location.reload();
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
