    <script>
      // Manifest per konteks — HARUS sebelum <link rel="manifest"> bawaan build. Safari hanya
      // membaca link manifest yang sudah ada saat HTML diurai (href yang diubah JS diabaikan) dan
      // peramban memakai link manifest PERTAMA. Aturan = src/lib/installScope.js (dijaga tes).
      (function () {
        var host = location.hostname;
        if (host !== 'alhijaz.co' && host !== 'localhost' && host !== '127.0.0.1') return;
        var reserved = ['login', 'register', 'reset-password', 'dashboard', 'teras', 'compare', 'top-partner', 'f', 'j', 'admin', 'api', 'assets', 'fonts', 'agents', 'og'];
        var segments = location.pathname.split('/').filter(Boolean);
        var first = segments[0];
        if (!first || !/^[A-Za-z0-9][A-Za-z0-9-]{0,63}$/.test(first) || reserved.indexOf(first.toLowerCase()) !== -1) return;
        var start = '/' + first + (segments[1] && segments[1].toLowerCase() === 'jamaah' ? '/jamaah' : '');
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = '/app.webmanifest?start=' + encodeURIComponent(start);
        document.head.appendChild(link);
      })();
    </script>

    <script>
      // Bypass service worker for server-rendered pages (Cloudflare Functions).
      // When the old cached SW serves this SPA for routes like /*/umroh,
      // this script detects it and forces a hard reload from the server.
      // Hanya landing server-rendered & berkas: /:slug/bio dan portal /jamaah adalah
      // rute SPA — me-reload-nya hanya menggandakan muat dokumen.
      (function() {
        var p = location.pathname;
        if (/\/[^/]+\/(?:umroh|haji)\/?$/i.test(p) || /^\/brosur\//i.test(p) || /^\/itinerary\//i.test(p)) {
          // Mark that we're doing a bypass reload so we don't loop
          var key = '__sw_bypass_' + p;
          try {
            if (sessionStorage.getItem(key)) {
              sessionStorage.removeItem(key);
              return; // Already reloaded once, don't loop
            }
            sessionStorage.setItem(key, '1');
          } catch (e) {
            return; // Storage unavailable; do not risk a reload loop
          }
          // Unregister SW for this scope, then hard reload
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
                location.reload();
              });
            });
          } else {
            location.reload();
          }
        }
      })();
    </script>
    <script>
      // Prefetch awal /api/schedules: mulai saat HTML diurai, bukan setelah chunk entry
      // selesai dieksekusi (~1,3 dtk di 4G + CPU 4×, audit 21 Sep 2026). data-service.ts
      // (fetchFromApi) memakai promise ini SEKALI lalu menghapusnya dari map — termasuk
      // revalidasi latar saat mount untuk cache basi (App.tsx preferPrefetch); pull-to-refresh
      // & interval tidak memakainya. Entri berumur > SCHEDULES_PREFETCH_MAX_AGE_MS (stempel
      // __schedulesPrefetchAt) dibuang oleh data-service. YEAR WAJIB sama dengan DEFAULT_YEAR_CODE,
      // kunci & TTL sama dengan PACKAGES_CACHE_PREFIX/PACKAGES_CACHE_TTL_MS di data-service.ts
      // (dijaga tests/schedules-prefetch-year.test.js). Tidak boleh pernah throw.
      (function () {
        try {
          var YEAR = '1448';
          var p = location.pathname;
          if (/^\/(login|register|reset-password|dashboard|admin|f|j|brosur|itinerary|top-partner|compare|teras|api|assets)(\/|$)/.test(p)) return;
          if (/\/(umroh|haji|bio|jamaah|kalkulasi)(\/|$)/.test(p)) return;
          // Agent yang sudah login membuka "/" di host PWA: main.tsx merender dashboard
          // langsung (shouldAutoRedirect && isPwaHost), App tidak pernah mount → prefetch
          // cuma menyaingi chunk dashboard + /api/auth/me lalu menggantung tanpa pemakai.
          if (p.replace(/\/+$/, '') === '' && /^(alhijaz\.co|localhost|127\.0\.0\.1)$/.test(location.hostname)) {
            try {
              if (localStorage.getItem('auth_session') || sessionStorage.getItem('auth_session')) return;
            } catch (e) {}
          }
          try {
            // Cache segar (< 30 menit): daftar tampil dari cache, revalidasi latarnya tidak
            // di jalur kritis — tidak perlu prefetch.
            var raw = localStorage.getItem('umroh_packages_cache_v2_' + YEAR);
            if (raw) {
              var head = /^\{"timestamp":(\d+)/.exec(raw);
              var ts = head ? Number(head[1]) : JSON.parse(raw).timestamp;
              if (typeof ts === 'number' && Date.now() - ts < 30 * 60 * 1000) return;
            }
          } catch (e) {}
          var req = fetch('/api/schedules/' + YEAR, { headers: { Accept: 'application/json' } });
          // Cabang catch tambahan supaya penolakan tidak jadi unhandled rejection;
          // promise asli (dengan penolakannya) tetap yang disimpan agar consumer bisa fallback.
          req.catch(function () {});
          window.__schedulesPrefetch = {};
          window.__schedulesPrefetch[YEAR] = req;
          // Stempel mulai per tahun: data-service membuang prefetch yang berumur lebih dari
          // batasnya supaya respons yang menggantung lama (tanpa pemakai) tidak pernah tampil —
          // apalagi tersimpan ke cache dengan stempel baru — sebagai kursi/harga segar.
          window.__schedulesPrefetchAt = {};
          window.__schedulesPrefetchAt[YEAR] = Date.now();
        } catch (e) {}
      })();
    </script>
